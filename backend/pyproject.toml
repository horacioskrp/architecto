[project]
name = "architecto"
version = "0.1.0"
description = "Architecto — agent IA Software Architect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-postgres>=0.0.12",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "alembic>=1.14",
    "httpx>=0.27",
    "pypdf>=5.1",
]

[project.optional-dependencies]
# Providers LLM optionnels (imports paresseux dans core/llm/providers/).
# Base = anthropic (chat par défaut) + openai (embeddings par défaut).
google = ["langchain-google-genai>=2.0"]
deepseek = ["langchain-deepseek>=0.1"]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecto"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
