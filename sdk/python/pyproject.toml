[project]
name = "architecto-sdk"
version = "0.1.0"
description = "SDK client Python pour l'agent Architecto"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecto_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"
