appId: com.architecto.app
productName: Architecto
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
