name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Annule les exécutions obsolètes sur une même branche/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps
        run: uv sync --extra dev --extra local
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
        env:
          LANGSMITH_TRACING: "false"

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
        env:
          # Le build (electron-vite) ne lance jamais Electron : inutile de
          # télécharger le binaire en CI.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx electron-vite build

  sdk:
    name: SDK Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Tests
        run: uv run --with pytest --with . pytest -q
