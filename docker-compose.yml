services:
  db:
    image: pgvector/pgvector:pg16
    container_name: architecto-db
    environment:
      POSTGRES_USER: architecto
      POSTGRES_PASSWORD: architecto
      POSTGRES_DB: architecto
    ports:
      # publié uniquement sur la loopback de l'hôte (pas exposé au réseau local)
      - "127.0.0.1:5433:5432"
    volumes:
      - architecto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architecto"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: architecto-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Surcharge la connexion pour le réseau docker (db:5432 en interne)
      DB_HOST: db
      DB_PORT: "5432"
    # Initialise le schéma (extension vector + tables) avant de démarrer l'API
    command: >-
      sh -c "python scripts/init_db.py &&
             uvicorn architecto.main:app --host 0.0.0.0 --port 8000"
    ports:
      # l'API n'est pas authentifiée : publiée seulement sur la loopback de l'hôte,
      # jamais exposée au réseau local (le conteneur écoute 0.0.0.0 en interne)
      - "127.0.0.1:8000:8000"

# L'app desktop (Electron) se lance en local (npm run dev) et pointe sur le backend.
# docker-compose n'orchestre donc que la base et l'API.

volumes:
  architecto_pgdata:
